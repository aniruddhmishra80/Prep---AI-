services:
  - type: web
    name: prep-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    # Note: free tier has ephemeral disk — SQLite + Chroma survive while the
    # process is up but are wiped on restart/redeploy. One sitting = one interview.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_API_KEY
        sync: false          # paste this in the Render dashboard, never in the file
      - key: EMBEDDING_PROVIDER
        value: google        # avoids downloading 80MB sentence-transformers on boot
      - key: GOOGLE_MODEL
        value: gemini-2.0-flash
      - key: GOOGLE_EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: TEMPERATURE
        value: "0.4"
      - key: MAX_QUESTIONS
        value: "8"
      - key: CORS_ORIGINS
        value: "*"           # Streamlit Cloud calls the API server-side, not via browser
