[project]
name = "ai-voice-interview-platform"
version = "1.0.0"
description = "Resume + JD aware adaptive AI interviewer with three-signal answer scoring"
# Pinned to 3.12 on purpose. uv resolves for EVERY Python version this range
# allows, not just the one being built with. On 3.13+, langchain-chroma pulls
# numpy>=2.1, which breaks the numpy<2 pin that chroma-hnswlib 0.7.3 needs -
# so an unbounded range makes the lock unsolvable even when the build itself
# is running 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "langchain==1.4.0",
    "langchain-core==1.6.3",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "langchain-google-genai==4.4.0",
    "langchain-chroma==0.2.3",
    "chromadb==0.4.24",
    "pypdf==6.19.0",
    "numpy>=1.26.2,<2.0.0",
    "google-generativeai==0.8.6",
]

[tool.vercel]
entrypoint = "backend.main:app"
